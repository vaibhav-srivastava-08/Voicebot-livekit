# Local development compose file: builds from the dev Dockerfiles and runs one instance of
# each service. Left unchanged by the production scaling work in this repo - for running
# multiple agent replicas against a shared LiveKit server + Redis, see docker-compose.prod.yml
# and DEPLOY.md instead.
version: "3.9"

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    env_file:
      - .env
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      - redis

  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
